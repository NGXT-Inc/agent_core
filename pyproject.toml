[project]
name = "agent-core"
version = "0.2.0"
description = "Core agent orchestration framework with multi-provider function calling and native session registry"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
openai = [
    "openai>=1.0.0",
]
openai-tiktoken = [
    "openai>=1.0.0",
    "tiktoken>=0.5.0",
]
openrouter = [
    "openai>=1.0.0",
]

[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "0.10"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/agent_core"]
wheel.py-api = "cp312"
sdist.include = [
    "src/agent_core/_cpp/**/*.cpp",
    "src/agent_core/_cpp/**/*.hpp",
    "src/agent_core/_cpp/CMakeLists.txt",
    "CMakeLists.txt",
]

[tool.scikit-build.cmake.define]
CMAKE_OSX_DEPLOYMENT_TARGET = "11.0"
