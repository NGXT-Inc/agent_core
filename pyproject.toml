[project]
name = "agent-core"
version = "0.1.0"
description = "Core agent orchestration framework with Gemini function calling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
persistence = [
    # SQLite is built-in, no extra deps needed
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_core"]
